verified_facts:
  - "งดการเรียนการสอนและปิดทำการเป็นกรณีพิเศษเพิ่มเติม วันที่ 1–2 ตุลาคม 2569"
  - "ครอบคลุมรามคำแหง 1 และรามคำแหง 2 ตามข้อความประชาสัมพันธ์ที่ให้มา"
  - "สาเหตุเกี่ยวข้องกับสถานการณ์น้ำท่วมภายในมหาวิทยาลัยและพื้นที่กรุงเทพมหานคร"
  - "การเรียนการสอนที่หัวหมากและวิทยาเขตบางนาให้งดการสอนในชั้นเรียน และผู้สอน/ประธานโครงการพิจารณาการสอนออนไลน์ตามความเหมาะสม"
  - "มหาวิทยาลัยคาดการณ์ว่าจะสามารถเปิดทำการได้วันจันทร์ที่ 5 ตุลาคม 2569"
