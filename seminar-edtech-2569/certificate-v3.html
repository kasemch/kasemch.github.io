<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>E-Certificate v3 • HPE EdTech 2569</title>
<style>
:root{--navy:#10284b;--crimson:#a51c30;--gold:#b48a3a;--paper:#fffdfa;--ink:#10284b}
*{box-sizing:border-box}html,body{margin:0;background:#eef1f5;font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:#1f2937}
.toolbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.toolbar .status{font-size:.85rem;opacity:.8}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.actions .pdf{background:#b72b3a;color:#fff}.actions .back{background:#fff;color:#111827}
.wrap{max-width:1160px;margin:20px auto;padding:0 12px 40px}.state{background:#fff;border:1px solid #d8dde6;border-radius:14px;padding:20px}.error{color:#8b1e28}.hidden{display:none!important}
.certificate-shell{overflow:auto;-webkit-overflow-scrolling:touch}
.certificate{width:1120px;height:792px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);box-shadow:0 12px 40px #0002;margin:0 auto}
.frame{position:absolute;pointer-events:none;border-radius:6px}.outer{inset:16px;border:2px solid var(--gold)}.inner{inset:26px;border:1px solid var(--navy)}
.corner{position:absolute;background:var(--navy);z-index:1}.tl{left:-40px;top:0;width:350px;height:105px;transform:skewX(-35deg)}.br{right:-40px;bottom:0;width:350px;height:105px;transform:skewX(-35deg)}
.ribbon{position:absolute;right:-30px;top:40px;width:250px;height:36px;background:var(--crimson);transform:rotate(-18deg);z-index:2}
.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-16deg);font-size:84px;font-weight:900;color:rgba(165,28,48,.05);white-space:nowrap}
.content{position:absolute;left:80px;right:80px;top:85px;text-align:center;z-index:3}.content h1{font-family:Georgia,serif;font-size:76px;line-height:1;margin:0;color:var(--navy)}.content h1 span{color:var(--crimson)}
.gold-rule{width:470px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto}
.badge{display:inline-block;background:var(--crimson);color:#fff;border:2px solid #d5b76d;border-radius:999px;padding:9px 32px;font-weight:800;font-size:23px;min-height:44px}
.grant{font-size:25px;margin:34px 0 10px}.recipient{font-size:54px;font-weight:850;line-height:1.2;min-height:66px}.name-rule{width:520px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:13px auto 24px}
.body-text{font-size:25px;margin:0}.project-title{font-size:30px;line-height:1.35;font-weight:800;color:var(--crimson);margin:12px auto;max-width:950px}.event-date{font-size:23px;margin-top:15px}
.bottom{position:absolute;left:62px;right:62px;bottom:55px;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:end;z-index:3}.num small{display:block;font-family:Georgia,serif;font-size:16px}.num strong{display:block;font-family:Georgia,serif;font-size:19px;margin-top:4px}.short{width:190px;height:1px;background:var(--gold);margin:10px 0}.num span{font-family:Georgia,serif;font-size:11px;letter-spacing:2px;color:#65758a}
.sign{text-align:center}.sigspace{height:55px}.sigline{width:310px;margin:0 auto 8px;border-top:1px solid var(--navy)}.sign strong{display:block;font-size:22px}.sign span{display:block;font-size:17px;margin-top:4px}
.qr{justify-self:end;width:132px;padding:10px;background:#fff;border:1px solid var(--gold);border-radius:6px;text-align:center}.qr img{display:block;width:106px;height:106px;margin:auto}.qr span{display:block;font-family:Georgia,serif;font-size:13px;margin-top:4px}
.note{text-align:center;color:#667085;margin-top:14px}
@media(max-width:800px){.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.certificate{width:980px;height:693px;transform-origin:top left}.wrap{padding-left:8px;padding-right:8px}.note{text-align:left}}
@page{size:A4 landscape;margin:0}
@media print{
 html,body{background:#fff;width:297mm;height:210mm}
 .toolbar,.note,.state{display:none!important}
 .wrap{margin:0;padding:0;max-width:none;width:297mm;height:210mm}
 .certificate-shell{overflow:visible;width:297mm;height:210mm}
 .certificate{width:297mm;height:210mm;box-shadow:none;margin:0;transform:none!important}
}
</style>
</head>
<body>
<header class="toolbar">
  <div><strong>E-Certificate</strong><div id="status" class="status">กำลังตรวจสอบ...</div></div>
  <div class="actions">
    <button id="pdfBtn" class="pdf" disabled>พิมพ์ / บันทึกเป็น PDF</button>
    <button class="back" onclick="history.back()">กลับ</button>
  </div>
</header>
<main class="wrap">
  <div id="loading" class="state">กำลังโหลดใบประกาศ...</div>
  <div id="error" class="state error hidden"></div>
  <div id="shell" class="certificate-shell hidden">
    <section id="certificate" class="certificate">
      <div class="frame outer"></div><div class="frame inner"></div>
      <div class="corner tl"></div><div class="corner br"></div><div class="ribbon"></div>
      <div id="watermark" class="watermark"></div>
      <div class="content">
        <h1><span>E</span>-Certificate</h1>
        <div class="gold-rule"></div>
        <div id="badge" class="badge"></div>
        <p class="grant">มอบให้แก่</p>
        <div id="recipient" class="recipient"></div>
        <div class="name-rule"></div>
        <p class="body-text">เพื่อรับรองการเข้าร่วมโครงการ</p>
        <div id="project" class="project-title"></div>
        <div id="date" class="event-date"></div>
      </div>
      <div class="bottom">
        <div class="num"><small>Certificate No.</small><strong id="certNo"></strong><div class="short"></div><span>EDUCATION • HEALTH • INNOVATION</span></div>
        <div class="sign"><div class="sigspace"></div><div class="sigline"></div><strong id="signer"></strong><span id="signerTitle"></span></div>
        <div class="qr"><img id="qr" alt="QR Verification"><span>QR Verification</span></div>
      </div>
    </section>
  </div>
  <p class="note">iPhone: แตะ “พิมพ์ / บันทึกเป็น PDF” → ในหน้าตัวอย่างการพิมพ์แตะ Share → Save to Files</p>
</main>
<script>
(function(){
  const API="https://lztxpjsuzqvtgyasfnyj.supabase.co/functions/v1/seminar-certificate-data";
  const qs=new URLSearchParams(location.search),cert=qs.get("cert"),token=qs.get("token");
  const $=id=>document.getElementById(id);
  function fail(msg){$("loading").classList.add("hidden");$("shell").classList.add("hidden");$("error").classList.remove("hidden");$("error").textContent=msg;$("status").textContent="เปิดไม่ได้"}
  function fit(el,base,min,limit){const n=Array.from(el.textContent||"").length;el.style.fontSize=(n<=limit?base:Math.max(min,Math.floor(base*limit/n)))+"px"}
  async function run(){
    if(!cert||!token){fail("ลิงก์ใบประกาศไม่สมบูรณ์");return}
    try{
      const r=await fetch(API+"?cert="+encodeURIComponent(cert)+"&token="+encodeURIComponent(token)+"&_="+Date.now(),{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||"certificate_not_found");
      $("recipient").textContent=j.recipient_name;
      $("project").textContent=j.event.title;
      $("certNo").textContent=j.certificate_no;
      $("signer").textContent=j.signer.name;
      $("signerTitle").textContent=j.signer.title;
      $("badge").textContent=j.watermark||"";
      $("watermark").textContent=j.watermark||"";
      if(!j.watermark)$("badge").classList.add("hidden");
      const d=new Date(j.event.date+"T00:00:00+07:00");
      $("date").textContent="วันที่ "+new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Bangkok"}).format(d);
      fit($("recipient"),54,36,25);fit($("project"),30,21,58);
      await new Promise((resolve,reject)=>{const img=$("qr");img.onload=resolve;img.onerror=reject;img.src=j.qr_data_url});
      $("loading").classList.add("hidden");$("shell").classList.remove("hidden");$("status").textContent="ตรวจสอบแล้ว • "+j.certificate_no;$("pdfBtn").disabled=false;
    }catch(e){fail("ไม่สามารถเปิดใบประกาศได้: "+e.message)}
  }
  $("pdfBtn").addEventListener("click",function(){window.print()});
  run();
})();
</script>
</body>
</html>
