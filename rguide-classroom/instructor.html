<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R-GUIDE Instructor · RPE6701</title><style>:root{--n:#14244a;--b:#315ca8;--bg:#f4f6fa;--m:#647089;--l:#dfe5ef;--ok:#16734a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:var(--bg);color:#172033}.s{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,var(--n),#355ea7);color:#fff;padding:22px;border-radius:18px}.c{background:#fff;padding:18px;border-radius:15px;margin-top:14px;box-shadow:0 4px 18px #14244a0c}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef3fb;padding:12px;border-radius:12px}.stat b{font-size:24px;color:var(--n)}label{font-weight:700;font-size:13px;display:block;margin-top:10px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5e4;border-radius:9px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}.alt{background:#e9eef8;color:#244b8e}.ok{background:var(--ok)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none}.muted{color:var(--m);font-size:13px}.row{border:1px solid var(--l);border-radius:11px;padding:11px;margin:8px 0}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf1f7;font-size:12px;font-weight:700}.answer{white-space:pre-wrap;background:#f7f8fb;padding:10px;border-radius:8px;margin:6px 0}@media(max-width:750px){.g,.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.g,.stats{grid-template-columns:1fr}}</style></head><body><div class="s"><section class="hero"><h1>R-GUIDE Instructor Console</h1><div>RPE6701 · Assignment → Submission → Feedback → Revision</div></section><section class="c" id="login"><h2>Instructor Access</h2><label>Instructor PIN</label><input id="pin" type="password"><div class="actions"><button class="btn" id="loginBtn">เข้าสู่ Control Room</button></div><div id="loginMsg" class="muted"></div></section><main id="app" class="hidden"><section class="c"><div class="actions"><button class="btn alt" id="refresh">รีเฟรช Dashboard</button><button class="btn alt" id="logout">ออกจากอุปกรณ์นี้</button><a class="btn alt" href="./" style="text-decoration:none">Student View</a></div><div class="stats" id="stats"></div></section><section class="c"><h2>Assignments</h2><div id="assignments"></div></section><section class="c"><h2>Student Submission Matrix</h2><div id="matrix"></div></section><section class="c hidden" id="review"><h2 id="reviewTitle">Review</h2><div id="answers"></div><h3>Instructor Feedback</h3><label>Decision / Status</label><select id="feedbackStatus"><option>COMMENT</option><option>REVISION_REQUIRED</option><option>EVIDENCE_REQUIRED</option><option>EXPERT_REVIEW_REQUIRED</option><option>COMPLETED</option></select><label>Feedback</label><textarea id="feedbackText" placeholder="WHAT → WHY → WHERE → HOW → NEXT ACTION"></textarea><div class="actions"><button class="btn ok" id="sendFeedback">บันทึก Feedback</button><button class="btn alt" id="closeReview">ปิด</button></div><div id="reviewMsg" class="muted"></div></section><section class="c"><h2>สร้าง Self-study Assignment ใหม่</h2><div class="g"><div><label>Assignment Code</label><input id="newCode" placeholder="SELFSTUDY2"></div><div><label>Sequence</label><input id="seq" type="number" value="3"></div></div><label>ชื่อกิจกรรม</label><input id="newTitle"><label>คำสั่งงาน</label><textarea id="newInstructions"></textarea><div class="actions"><button class="btn" id="createBtn">เผยแพร่งาน</button></div><div id="createMsg" class="muted">กำหนดส่งสามารถประกาศภายหลังได้ ระบบจะเปิดงานทันทีเมื่อเผยแพร่</div></section></main></div><script>const API='https://zimbrsdvxogsfmpflxcr.supabase.co/functions/v1/classroom-api',K='rguide-instructor-session-v1';let session=JSON.parse(localStorage.getItem(K)||'null'),overview=null,reviewTarget=null;async function call(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:session?.token,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'REQUEST_FAILED');return j}async function login(){let p=document.getElementById('pin').value.trim(),m=document.getElementById('loginMsg');m.textContent='กำลังเข้าสู่ระบบ…';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',learnerCode:'INSTRUCTOR',pin:p})}),j=await r.json();if(!r.ok||j.role!=='INSTRUCTOR')throw new Error(j.error||'DENIED');session={token:j.token,expiresAt:j.expiresAt};localStorage.setItem(K,JSON.stringify(session));show()}catch(e){m.textContent='เข้าสู่ระบบไม่ได้: '+e.message}}function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}async function load(){try{overview=await call('overview');render()}catch(e){if(e.message==='SESSION_REQUIRED'){localStorage.removeItem(K);location.reload()}else alert(e.message)}}function render(){const s=overview.submissions||[],submitted=s.filter(x=>['SUBMITTED','RESUBMITTED','COMPLETED','REVISION_REQUIRED'].includes(x.status)).length,students=new Set(s.map(x=>x.learner_code)).size,rev=s.filter(x=>x.status==='REVISION_REQUIRED').length,done=s.filter(x=>x.status==='COMPLETED').length;document.getElementById('stats').innerHTML=`<div class="stat"><b>${students}</b><br>Students active</div><div class="stat"><b>${submitted}</b><br>Submissions</div><div class="stat"><b>${rev}</b><br>Revision required</div><div class="stat"><b>${done}</b><br>Completed</div>`;document.getElementById('assignments').innerHTML=overview.assignments.map(a=>`<div class="row"><b>${a.assignment_code}</b> · ${a.title}<br><span class="pill">${a.assignment_type}</span> <span class="pill">${a.status}</span><div class="muted">${a.due_at?'Due '+new Date(a.due_at).toLocaleString('th-TH'):'No fixed due date'}</div></div>`).join('');let codes=Array.from({length:11},(_,i)=>'S'+String(i+1).padStart(2,'0'));document.getElementById('matrix').innerHTML=codes.map(c=>{let rows=overview.assignments.map(a=>{let x=s.find(z=>z.learner_code===c&&z.assignment_code===a.assignment_code);return `<span class="pill">${a.assignment_code}: ${x?.status||'NOT STARTED'}</span>`}).join(' ');return `<div class="row"><b>${c}</b><div style="margin:6px 0">${rows}</div><div class="actions">${overview.assignments.map(a=>`<button class="btn alt" onclick="reviewOne('${c}','${a.assignment_code}')">Review ${a.assignment_code}</button>`).join('')}</div></div>`}).join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function reviewOne(code,assignment){reviewTarget={code,assignment};let j=await call('reviewSubmission',{learnerCode:code,assignmentCode:assignment});document.getElementById('review').classList.remove('hidden');document.getElementById('reviewTitle').textContent=`Review · ${code} · ${assignment}`;let p=j.submission?.payload||{};document.getElementById('answers').innerHTML=j.submission?Object.entries(p).map(([k,v])=>`<div><b>${esc(k)}</b><div class="answer">${esc(v)}</div></div>`).join(''):'<p class="muted">ยังไม่มี submission</p>';document.getElementById('review').scrollIntoView({behavior:'smooth'})}window.reviewOne=reviewOne;async function feedback(){if(!reviewTarget)return;let text=document.getElementById('feedbackText').value.trim(),status=document.getElementById('feedbackStatus').value,m=document.getElementById('reviewMsg');if(!text){m.textContent='กรุณาเขียน feedback';return}try{await call('feedback',{learnerCode:reviewTarget.code,assignmentCode:reviewTarget.assignment,status,feedbackText:text});m.textContent='บันทึก feedback แล้ว';document.getElementById('feedbackText').value='';await load()}catch(e){m.textContent=e.message}}async function createAssignment(){let code=document.getElementById('newCode').value.trim(),title=document.getElementById('newTitle').value.trim(),instructions=document.getElementById('newInstructions').value.trim(),sequenceNo=Number(document.getElementById('seq').value||99),m=document.getElementById('createMsg');if(!code||!title||!instructions){m.textContent='กรอก code, ชื่อกิจกรรม และคำสั่งงานให้ครบ';return}try{let j=await call('createAssignment',{assignmentCode:code,title,instructions,sequenceNo,activitySchema:[{id:'work',title:'งานค้นคว้า/วิเคราะห์'},{id:'evidence',title:'หลักฐานและแหล่งที่มา'},{id:'reflection',title:'Reflection'},{id:'nextAction',title:'Next Action'}]});m.textContent='เผยแพร่ '+j.assignmentCode+' แล้ว';await load()}catch(e){m.textContent='สร้างงานไม่สำเร็จ: '+e.message}}document.getElementById('loginBtn').onclick=login;document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=()=>{localStorage.removeItem(K);location.reload()};document.getElementById('sendFeedback').onclick=feedback;document.getElementById('closeReview').onclick=()=>document.getElementById('review').classList.add('hidden');document.getElementById('createBtn').onclick=createAssignment;if(session?.token&&session?.expiresAt&&new Date(session.expiresAt)>new Date())show();</script></body></html>
