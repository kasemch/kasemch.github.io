name: Seminar EdTech 2569 static checks
on:
  pull_request:
    paths:
      - 'seminar-edtech-2569/**'
      - '.github/workflows/seminar-edtech-2569-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          test -f seminar-edtech-2569/index.html
          test -f seminar-edtech-2569/styles.css
          test -f seminar-edtech-2569/app.js
          test -f seminar-edtech-2569/config.js
          test -f seminar-edtech-2569/admin.html
          test -f seminar-edtech-2569/admin.css
          test -f seminar-edtech-2569/admin.js
      - name: No obvious secrets
        run: |
          ! grep -RniE '(SUPABASE_SERVICE_ROLE|AIza[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{20,})' seminar-edtech-2569 --exclude='README.md' --exclude='supabase-schema.sql'
