name: ARM Stats Neon Deploy

on:
  workflow_dispatch:
  push:
    branches: [master, arm-job-scout-v3-hybrid]
    paths:
      - 'arm-jobs/analytics-collector/**'
      - '.github/workflows/armstats-neon-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arm-jobs/analytics-collector
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: shy-firefly-97065051
      ARMSTATS_URL: https://br-gentle-voice-b3op1wfq-armstats.compute.c-4.ap-southeast-1.aws.neon.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Neon secret
        shell: bash
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY repository secret is required."
            exit 2
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Neon CLI
        run: npm install --global neon@latest

      - name: Link Neon project
        run: neon link --project-id "$NEON_PROJECT_ID" --yes

      - name: Deployment plan
        run: neon config plan

      - name: Deploy ARM stats function
        run: neon deploy

      - name: Synthetic page-view test
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/armstats-visit.json --write-out '%{http_code}' \
            --request POST "$ARMSTATS_URL/visit" \
            --header 'Origin: https://kasemch.github.io' \
            --header 'Content-Type: application/json' \
            --data '{"visitor_id":"synthetic_armstats_v3_visit","page_path":"/arm-jobs/"}')
          cat /tmp/armstats-visit.json
          echo
          test "$code" = "201"

      - name: Synthetic interaction test
        shell: bash
        run: |
          for event in job_source_click prepare_application cv_builder; do
            code=$(curl --silent --show-error --output "/tmp/armstats-${event}.json" --write-out '%{http_code}' \
              --request POST "$ARMSTATS_URL/event" \
              --header 'Origin: https://kasemch.github.io' \
              --header 'Content-Type: application/json' \
              --data "{\"visitor_id\":\"synthetic_armstats_v3_event\",\"page_path\":\"/arm-jobs/\",\"event\":\"${event}\",\"detail\":\"synthetic_qa\"}")
            cat "/tmp/armstats-${event}.json"
            echo
            test "$code" = "201"
          done

      - name: Reject unknown interaction event
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/armstats-reject.json --write-out '%{http_code}' \
            --request POST "$ARMSTATS_URL/event" \
            --header 'Origin: https://kasemch.github.io' \
            --header 'Content-Type: application/json' \
            --data '{"visitor_id":"synthetic_armstats_v3_reject","page_path":"/arm-jobs/","event":"unknown_event"}')
          cat /tmp/armstats-reject.json
          echo
          test "$code" = "400"
